<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiddy.ai - Student & Admin Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center py-5">

    <!-- Global Loading Spinner -->
    <div id="global-loader" class="loader-overlay hidden">
        <div class="spinner-custom"></div>
    </div>

    <!-- Login Container -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <a class="navbar-brand text-gradient d-flex align-items-center justify-content-center mb-3" href="index.html" style="font-size: 2rem;">
                            <span class="fw-extrabold"><i class="bi bi-rocket-takeoff-fill text-primary"></i> Kiddy.ai</span>
                        </a>
                    </div>
                    
                    <!-- Clerk Sign In Component Mount Point -->
                    <div id="clerk-signin-mount"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Clerk Sign In Script -->
    <script type="module">
        import { clerkLoadedPromise } from "./js/auth.js";

        async function initPage() {
            const clerk = await clerkLoadedPromise;
            clerk.mountSignIn(document.getElementById("clerk-signin-mount"), {
                afterSignInUrl: "dashboard.html",
                signUpUrl: "register.html"
            });
        }
        initPage();
    </script>
</body>
</html>
